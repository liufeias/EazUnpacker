name: Build EazUnpacker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            8.0.x

      - name: Show environment
        run: |
          dotnet --info
          [Environment]::OSVersion.Version

      - name: Restore main project
        run: dotnet restore Unpacker.slnx

      - name: Restore modern worker
        run: dotnet restore src/ModernWorker/ModernWorker.csproj

      - name: Build main project (Release)
        run: dotnet build Unpacker.slnx -c Release --no-restore

      - name: Build modern worker (Release)
        run: dotnet build src/ModernWorker/ModernWorker.csproj -c Release --no-restore

      - name: Assemble distributable
        shell: pwsh
        run: |
          $out = "dist/EazUnpacker"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # 1) 主程序输出（含 worker 子目录）
          Copy-Item -Recurse -Force "src/bin/Release/net48/*" $out

          # 2) 可选现代后端 -> worker/modern
          $modern = Join-Path $out "worker/modern"
          New-Item -ItemType Directory -Force -Path $modern | Out-Null
          Copy-Item -Recurse -Force "src/ModernWorker/bin/Release/net8.0-windows/*" $modern

          # 3) 许可证与说明
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" $out }
          if (Test-Path "NOTICE")  { Copy-Item "NOTICE"  $out }
          if (Test-Path "README.md") { Copy-Item "README.md" $out }

          # 4) 生成 zip 压缩包
          $zip = "dist/EazUnpacker-${{ github.ref_name }}.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$out/*" -DestinationPath $zip -CompressionLevel Optimal
          Get-ChildItem dist | Format-Table Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EazUnpacker-${{ github.ref_name }}
          path: dist/*.zip
          if-no-files-found: error

      # 打 tag 时自动发布 Release
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
